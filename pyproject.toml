[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aelora-virtual-gateway"
version = "0.1.0"
description = "Separately runnable virtual solar-site gateway for Aelora"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
aelora-virtual-gateway = "aelora_virtual_gateway.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aelora_virtual_gateway"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
