name: Virtual gateway CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest --cov=aelora_virtual_gateway --cov-report=term-missing
      - run: python -m pip check
      - run: python -m pip_audit
      - run: docker build --tag aelora-gateway:ci .
